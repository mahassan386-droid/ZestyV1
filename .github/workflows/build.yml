name: Build Zesty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files
        run: |
          unzip -o ZestyV1_CloudBuild.zip -d extracted_project

      - name: Fix Compatibility and Build
        run: |
          TARGET_DIR=$(find extracted_project -maxdepth 2 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="extracted_project"
          fi
          cd "$TARGET_DIR"
          
          # تعديل إعدادات Java في app/build.gradle.kts لتصبح 17 تلقائياً
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
            sed -i 's/JVM_1_8/JVM_17/g' app/build.gradle.kts
          fi

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zesty-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
