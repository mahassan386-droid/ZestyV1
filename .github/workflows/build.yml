name: Build Zesty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files
        run: |
          echo "جاري فك ضغط ملف المشروع..."
          unzip -o ZestyV1_CloudBuild.zip -d extracted_project
          ls -la extracted_project

      - name: Build APK
        run: |
          TARGET_DIR=$(find extracted_project -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "خطأ: لم يتم العثور على ملفات البناء حتى بعد فك الضغط!"
            exit 1
          fi
          echo "تم العثور على المشروع في: $TARGET_DIR"
          cd "$TARGET_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zesty-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
