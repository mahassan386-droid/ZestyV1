name: Build Zesty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build
        run: |
          echo "=== عرض قائمة الملفات المرفوعة ==="
          ls -la
          
          # البحث عن مجلد يحتوي على build.gradle أو build.gradle.kts
          TARGET_DIR=$(find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec dirname {} \; | head -n 1)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "خطأ: لم يتم العثور على أي ملفات بناء Android (build.gradle) في المستودع!"
            echo "يرجى التأكد من رفع ملفات المشروع وليس الملف المضغوط .zip"
            exit 1
          fi
          
          echo "تم العثور على المشروع في المسار: $TARGET_DIR"
          cd "$TARGET_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zesty-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
