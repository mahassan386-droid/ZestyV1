name: Build Zesty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # البحث عن المكان الذي يحتوي على ملفات المشروع والدخول إليه
          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            gradle assembleDebug
          else
            DIR=$(find . -maxdepth 2 -name "build.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
            cd "$DIR"
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zesty-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
