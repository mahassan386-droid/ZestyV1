name: Build Zesty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files
        run: |
          unzip -o ZestyV1_CloudBuild.zip -d extracted_project

      - name: Build APK
        run: |
          TARGET_DIR=$(find extracted_project -maxdepth 2 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="extracted_project"
          fi
          cd "$TARGET_DIR"
          
          mkdir -p ~/.gradle
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> ~/.gradle/gradle.properties
          
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=IGNORE

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Zesty-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
